name: Publish

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up uv and Python 3.13
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: auto
      - name: build and publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PROJECT_TOKEN }}
        run: |
          uv run --locked --only-group nox nox -s build
          uv publish
      - name: create release branch
        uses: peterjgrainger/action-create-branch@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: ${{ github.event.release.tag_name }}
