name: Weekly prerelease dependencies

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      UV_PRERELEASE: allow
      TERM: xterm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
      - run: uv lock --upgrade
      - run: uv run --locked --only-group nox nox -s unit_tests-3.13
