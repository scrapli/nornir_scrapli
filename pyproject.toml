[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nornir_scrapli"
dynamic = [
    "version",
]
description = "Scrapli's plugin for Nornir"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "nornir>=3.0.0",
    "nornir_utils>=0.1.0",
    "ntc_templates>=1.1.0",
    "scrapli>=2022.01.30",
    "scrapli_cfg>=2022.01.30",
    "scrapli_community>=2021.01.30",
    "scrapli_netconf>=2022.01.30",
    "textfsm>=1.1.0",
]
authors = [
    { name = "Carl Montanari", email = "carl.r.montanari@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "arista",
    "automation",
    "cisco",
    "eos",
    "iosxe",
    "iosxr",
    "juniper",
    "junos",
    "netconf",
    "network",
    "nxos",
    "ssh",
    "telnet",
]

[project.urls]
Homepage = "https://github.com/scrapli/nornir_scrapli"
Docs = "https://scrapli.github.io/nornir_scrapli/"

[project.entry-points."nornir.plugins.connections"]
scrapli = "nornir_scrapli.connection:ScrapliCore"
scrapli_cfg= "nornir_scrapli.connection:ScrapliConfig"
scrapli_netconf= "nornir_scrapli.connection:ScrapliNetconf"

[project.optional-dependencies]
dev = [
    "nornir_scrapli[genie]",
    "mypy>1.0.0,<2.0.0", "nox>=2025.2.9",
    "pytest-cov>=3.0.0,<5.0.0", "pytest>=7.0.0,<8.0.0",
    "ruff>=0.16.7,<0.17.0",
]
docs = [
    "mdx-gh-links>=0.2,<1.0", "mkdocs>=1.2.3,<2.0.0",
    "mkdocs-gen-files>=0.4.0,<1.0.0", "mkdocs-literate-nav>=0.5.0,<1.0.0",
    "mkdocs-material>=8.1.6,<10.0.0", "mkdocs-material-extensions>=1.0.3,<2.0.0",
    "mkdocs-section-index>=0.3.4,<1.0.0", "mkdocstrings[python]>=0.19.0,<1.0.0",
]
genie = [
    "genie>=20.2; sys_platform != 'win32' and python_version < '3.14'",
    "pyats>=20.2; sys_platform != 'win32' and python_version < '3.14'",
]

[dependency-groups]
dev = [{include-group = "nox"}, {include-group = "test"}, {include-group = "lint"}]
nox = ["nox>=2025.2.9"]
test = ["pytest>=7.0.0,<8.0.0", "pytest-cov>=3.0.0,<5.0.0"]
lint = ["mypy>1.0.0,<2.0.0", "ruff>=0.16.7,<0.17.0"]
docs = ["nornir_scrapli[docs]"]
build = ["setuptools", "wheel"]

[tool.setuptools.dynamic]
version = { attr = "nornir_scrapli.__version__" }

[tool.setuptools.package-data]
nornir_scrapli = [
    "py.typed"
]

[tool.setuptools.packages.find]
include = ["nornir_scrapli*"]

[tool.coverage.run]
source = [
    "nornir_scrapli"
]

[tool.coverage.report]
sort = "cover"

[tool.coverage.paths]
source = [
    "nornir_scrapli",
    "*/site-packages/nornir_scrapli",
]

[tool.ruff]
line-length = 100
target-version = "py310"
include = [
    "*.py",
    "docs/generate.py",
    "nornir_scrapli/**/*.py",
    "tests/**/*.py",
    "examples/**/*.py",
]

[tool.ruff.lint]
# DOC (pydoclint) rules are still in preview; explicit-preview-rules keeps every other
# preview rule out, so selecting a prefix like PL or RUF stays stable across upgrades.
preview = true
explicit-preview-rules = true
select = [
    # UP is deliberately left out: pep585/604 annotations are a separate change
    "E", "W", "F", "I", "D", "N", "PL", "C90",
    "PERF", "FURB", "RUF", "ERA", "FIX",
    # DOC202 is deliberately not selected; darglint ignored its DAR202 equivalent
    "DOC102", "DOC201", "DOC402", "DOC403", "DOC501", "DOC502",
]
ignore = [
    "D101",     # missing docstring in public class (init docstrings cover this)
    "D202",     # no blank lines allowed after function docstring
    "D212",     # multi-line docstring summary should start at the first line
    "D415",     # first line should end with a period, question mark, or exclamation point
    "N818",     # exception name should be named with an Error suffix
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["nornir"]

[tool.ruff.lint.per-file-ignores]
# W291/W293: test_helper.py holds xml fixtures whose trailing whitespace is part of the fixture
"tests/**/*.py" = ["D", "DOC", "E501", "PLR2004", "PLC0415", "W291", "W293"]
"examples/**/*.py" = ["D"]
"docs/generate.py" = ["D"]
"noxfile.py" = ["D103"]

[tool.mypy]
python_version = "3.10"
pretty = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
